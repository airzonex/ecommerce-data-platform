services:

  # ===========================================================================
  # PostgreSQL OLTP
  # ===========================================================================

  postgres-oltp:
    image: postgres:17
    container_name: ecommerce-postgres-oltp
    restart: unless-stopped

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    environment:
      POSTGRES_DB: ${POSTGRES_OLTP_DB}
      POSTGRES_USER: ${POSTGRES_OLTP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OLTP_PASS}

      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASS: ${DEBEZIUM_PASS}

    ports:
      - "${POSTGRES_OLTP_HOST_PORT}:5432"

    volumes:
      - postgres_oltp_data:/var/lib/postgresql/data
      - ./docker/postgres_oltp/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_OLTP_USER} -d ${POSTGRES_OLTP_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - ecommerce


  # ===========================================================================
  # Kafka
  # ===========================================================================
  
  kafka:
    image: apache/kafka:4.1.2
    container_name: ecommerce-kafka
    restart: unless-stopped

    ports:
      - "${KAFKA_HOST_PORT}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - ecommerce


  # ===========================================================================
  # Kafka Connect / Debezium
  # ===========================================================================

  kafka-connect:
    image: quay.io/debezium/connect:3.5.2.Final
    container_name: ecommerce-kafka-connect
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:29092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    networks:
      - ecommerce


# ====================================================================
# Volumes
# ====================================================================

volumes:
  postgres_oltp_data:
  kafka_data:

# ====================================================================
# Network
# ====================================================================

networks:

  ecommerce:
    name: ecommerce-network
    driver: bridge
